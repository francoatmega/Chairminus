name: Release

# Run from the Actions tab: bumps the version in package.json, commits it to main, tags it,
# builds the macOS disk images and the Windows zip, and publishes them as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease:
        description: Mark as pre-release (not production ready)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: bump
        run: |
          version=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          version=${version#v}
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.version }}"
          git push origin main "${{ steps.bump.outputs.version }}"

  build:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: macOS (Apple Silicon)
        run: npm run dist:mac
        env:
          CHAIRMINUS_ARCH: arm64
      - name: macOS (Intel)
        run: npm run dist:mac
        env:
          CHAIRMINUS_ARCH: x64
      - name: Windows
        run: npm run dist:win
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            dist/Chairminus-"$VERSION"-arm64.dmg \
            dist/Chairminus-"$VERSION"-x64.dmg \
            dist/Chairminus-"$VERSION"-win32-x64.zip
